{% extends "layout.html" %}

{% block body %}
<h4>Log Out</h4>

<p>Log out of Sali Lab web services as user {{ g.user.name }}?</p>

<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <table>
    <tr>
      <td><input type="submit" name=".submit" value="Log out" /></td>
      <td><a href="{{ url_for("index") }}">Cancel</a></td>
    </tr>
  </table>
</form>
{% endblock %}
